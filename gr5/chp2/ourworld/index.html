<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grade 5 – Our World HOTS Challenge</title>
<style>
:root{
  --sky:#eef8ff;
  --blue:#1976d2;
  --deep:#12345b;
  --teal:#18a999;
  --yellow:#ffc857;
  --orange:#ff8c42;
  --green:#25a86b;
  --red:#e85d5d;
  --white:#fff;
  --ink:#17324d;
  --muted:#64809a;
  --shadow:0 12px 30px rgba(31,75,110,.15);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%,#ffffff 0 4%,transparent 20%),
    radial-gradient(circle at 90% 20%,#d8f4ff 0 5%,transparent 24%),
    linear-gradient(145deg,#eaf8ff,#f8fcff 52%,#e8fff7);
  overflow-x:hidden;
}
button{font-family:inherit}
.screen{
  display:none;
  min-height:100svh;
  width:100%;
  padding:clamp(10px,2vw,22px);
  position:relative;
  z-index:1;
}
.screen.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SPLASH – logo only, white background */
#splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#fff !important;
  padding:0;
}
#splash .logo{
  width:min(230px,48vw);
  max-height:230px;
  object-fit:contain;
}

/* Decorative background */
.bubble{
  position:fixed;
  border-radius:50%;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
.b1{width:110px;height:110px;background:#bde9ff;left:-35px;top:12%}
.b2{width:80px;height:80px;background:#c9f4e6;right:-22px;top:25%}
.b3{width:65px;height:65px;background:#ffe5a8;left:8%;bottom:4%}
.b4{width:95px;height:95px;background:#d9d2ff;right:5%;bottom:-25px}

.panel{
  width:min(980px,100%);
  max-height:calc(100svh - 20px);
  background:rgba(255,255,255,.94);
  border:2px solid rgba(25,118,210,.10);
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:clamp(14px,2.4vw,24px);
  overflow:hidden;
}
.intro-panel{text-align:center}
.planet{
  width:74px;height:74px;
  margin:0 auto 8px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:43px;
  background:linear-gradient(145deg,#d9f5ff,#fff);
  box-shadow:0 7px 18px rgba(25,118,210,.16);
}
.title{
  font-size:clamp(25px,4vw,40px);
  font-weight:900;
  color:var(--deep);
  margin:4px 0 6px;
}
.subtitle{
  color:var(--muted);
  font-size:clamp(14px,2vw,18px);
  line-height:1.45;
  margin:0 auto;
  max-width:720px;
}
.rules{
  margin:14px auto;
  padding:12px 16px;
  max-width:650px;
  border-radius:18px;
  background:#f2f9ff;
  text-align:left;
  line-height:1.55;
  font-size:clamp(13px,1.8vw,16px);
}
.rules div{margin:3px 0}
.start{
  border:0;
  border-radius:16px;
  padding:13px 24px;
  background:linear-gradient(135deg,var(--yellow),#ffe79a);
  color:#573d00;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(255,200,87,.25);
}
.start:active{transform:scale(.98)}

.quiz-panel{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.topbar{
  display:grid;
  grid-template-columns:auto auto 1fr auto;
  gap:8px;
  align-items:center;
}
.chip{
  background:#f2f8fd;
  border:1px solid #dbeaf5;
  border-radius:999px;
  padding:7px 11px;
  font-size:clamp(12px,1.7vw,15px);
  font-weight:900;
  white-space:nowrap;
}
.progress{
  height:8px;
  background:#e6eef5;
  border-radius:99px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--teal),var(--blue));
  transition:width .25s ease;
}
.question-card{
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f5fbff);
  border:1px solid #dcebf5;
  padding:clamp(12px,2vw,20px);
  box-shadow:0 7px 20px rgba(37,90,125,.08);
}
.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}
.badge{
  font-size:12px;
  font-weight:900;
  color:#17639b;
  background:#e5f5ff;
  padding:5px 9px;
  border-radius:999px;
}
.question{
  font-size:clamp(17px,2.5vw,23px);
  line-height:1.35;
  font-weight:800;
  margin:4px 0 13px;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.option{
  min-height:58px;
  border:2px solid #dceaf4;
  background:#fff;
  border-radius:15px;
  padding:10px 12px;
  color:var(--ink);
  text-align:left;
  font-size:clamp(13px,1.8vw,16px);
  line-height:1.3;
  font-weight:700;
  cursor:pointer;
  transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
}
.option:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(25,118,210,.10)}
.option:disabled{cursor:default}
.option.correct{
  background:#e7f9ef;
  border-color:#38ad70;
  color:#12643d;
}
.option.wrong{
  background:#fff0f0;
  border-color:#e85d5d;
  color:#9b2727;
  animation:shake .22s linear 1;
}
.feedback{
  min-height:39px;
  margin-top:10px;
  border-radius:13px;
  padding:9px 12px;
  background:#f4f8fb;
  color:var(--muted);
  font-size:clamp(12px,1.7vw,15px);
  line-height:1.35;
}
.feedback.good{background:#eafaf1;color:#14663e;border:1px solid #bce8cf}
.feedback.bad{background:#fff2f2;color:#9a2d2d;border:1px solid #f1c3c3}

@keyframes shake{
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}

.result{text-align:center}
.result-icon{font-size:70px;line-height:1}
.score{
  font-size:clamp(38px,7vw,60px);
  color:var(--blue);
  font-weight:900;
  margin:8px 0;
}
.restart{
  border:0;
  border-radius:15px;
  padding:12px 22px;
  background:var(--blue);
  color:white;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}
.effects{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  overflow:hidden;
}
.effects span{
  position:absolute;
  font-size:25px;
  animation:pop .8s ease-out forwards;
}
@keyframes pop{
  from{transform:translateY(0) scale(.4);opacity:1}
  to{transform:translateY(-70px) rotate(180deg) scale(1.2);opacity:0}
}

/* Phone optimisation */
@media(max-width:620px){
  .screen{padding:7px}
  .panel{
    max-height:calc(100svh - 14px);
    border-radius:20px;
    padding:10px;
  }
  .planet{width:52px;height:52px;font-size:30px}
  .title{font-size:24px}
  .rules{margin:9px auto;padding:9px 12px;font-size:12px}
  .start{padding:11px 20px;font-size:15px}
  .topbar{
    grid-template-columns:1fr 1fr;
    gap:5px;
  }
  .chip{padding:6px 8px;text-align:center}
  .question-card{padding:10px}
  .question{font-size:16px;line-height:1.28;margin-bottom:9px}
  .options{grid-template-columns:1fr;gap:6px}
  .option{
    min-height:0;
    padding:8px 10px;
    font-size:13px;
    line-height:1.25;
  }
  .feedback{margin-top:7px;min-height:34px;padding:7px 9px;font-size:12px}
}
@media(max-height:650px) and (min-width:621px){
  .panel{padding:12px}
  .question{font-size:18px}
  .option{min-height:48px;padding:8px 10px}
}
</style>
</head>

<body>
<div class="bubble b1"></div><div class="bubble b2"></div>
<div class="bubble b3"></div><div class="bubble b4"></div>

<!-- Splash: ONLY the Innovine logo -->
<section id="splash" class="screen active">
  <img class="logo" src="assets/logo.png" alt="Innovine logo">
</section>

<section id="intro" class="screen">
  <div class="panel intro-panel">
    <div class="planet">🌍</div>
    <div class="title">Our World</div>
    <p class="subtitle">Grade 5 • Higher-Order Thinking Challenge</p>
    <div class="rules">
      <div>🧠 Read each situation carefully.</div>
      <div>🎯 Choose the best answer.</div>
      <div>🔁 You get 2 attempts for each question.</div>
      <div>✨ A correct answer earns 1 point.</div>
    </div>
    <button class="start" id="startBtn">🚀 Start Challenge</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="panel quiz-panel">
    <div class="topbar">
      <div class="chip" id="scoreChip">⭐ 0</div>
      <div class="chip" id="timerChip">⏱ 45s</div>
      <div class="chip" id="attemptChip">Attempt 1/2</div>
      <div class="chip" id="qChip">Q 1/12</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="question-card">
      <div class="meta">
        <span class="badge">🌎 OUR WORLD</span>
        <span class="badge" id="levelBadge">HOTS</span>
      </div>
      <div class="question" id="questionText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback">Choose the best answer.</div>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <div class="panel result">
    <div class="result-icon">🏆</div>
    <div class="title">Challenge Complete!</div>
    <div class="score" id="finalScore">0/12</div>
    <p class="subtitle" id="finalText"></p>
    <br>
    <button class="restart" id="restartBtn">🔄 Play Again</button>
  </div>
</section>

<div class="effects" id="effects"></div>

<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/claps.mp3" preload="auto"></audio>

<script>
const questions = [
{
 q:"Riya notices that it is daytime in India while her friend in the United States is experiencing night. Which explanation best describes this situation?",
 o:[
 "The Earth is revolving around the Sun",
 "Different parts of the Earth face the Sun at different times because of rotation",
 "The Earth changes its distance from the Sun every day",
 "The Sun moves around the Earth"
 ],
 a:1,
 e:"Earth's rotation makes different parts of the Earth face the Sun at different times."
},
{
 q:"A student says, The Sun moves from east to west across the sky every day, so the Sun must be moving around the Earth. Which response is most accurate according to the chapter?",
 o:[
 "Yes, the Sun moves around the Earth every 24 hours",
 "No, the apparent movement of the Sun is caused by the Earth rotating on its axis",
 "Yes, because the Earth does not move",
 "No, because the Sun only moves during the daytime"
 ],
 a:1,
 e:"The apparent movement of the Sun is caused by Earth's rotation."
},
{
 q:"Two students are planning a trip. One says the weather forecast for today is enough to understand the climate of a place. Why is this reasoning incorrect?",
 o:[
 "Weather and climate are exactly the same",
 "Climate describes the typical weather of a place over many years",
 "Weather only describes temperature",
 "Climate changes every few hours"
 ],
 a:1,
 e:"Climate describes the typical weather pattern of a place over many years."
},
{
 q:"Imagine that Earth continued to revolve around the Sun but had no tilt on its axis. Which change would most likely occur according to the chapter?",
 o:[
 "Day and night would stop",
 "The Earth would stop rotating",
 "The usual seasonal changes would not occur in the same way",
 "The Earth would no longer have an orbit"
 ],
 a:2,
 e:"Earth's tilt, together with its revolution around the Sun, contributes to seasonal changes."
},
{
 q:"Aarav is travelling to a place with a very dry climate and very little rainfall. Which decision would show that he has correctly applied his knowledge of climate?",
 o:[
 "Pack clothes suitable for very heavy rainfall",
 "Pack clothing and supplies suitable for a dry environment",
 "Pack only winter clothes because every dry place is cold",
 "Pack only raincoats because all climates change daily"
 ],
 a:1,
 e:"Knowing the climate helps people prepare suitable clothing and supplies."
},
{
 q:"A teacher asks students to compare two cities. City A has a hot, wet climate, while City B has a very dry climate. Which factor is most likely to affect the way people live in these two cities?",
 o:[
 "Climate can influence clothing and daily activities",
 "Climate determines the name of a country",
 "Climate changes the Earth's axis",
 "Climate determines whether a city has a capital"
 ],
 a:0,
 e:"Climate can influence clothing, activities and other aspects of daily life."
},
{
 q:"During a class activity, a student places a globe so that one side faces a lamp and the other side faces away from it. What can this model help the student understand?",
 o:[
 "Why countries have different capitals",
 "How rotation causes day and night",
 "Why all countries have the same climate",
 "How oceans are formed"
 ],
 a:1,
 e:"The model helps demonstrate how different parts of Earth experience day and night."
},
{
 q:"A student wants to understand why people in different parts of the world may experience different seasons at the same time. Which two ideas from the chapter should the student connect?",
 o:[
 "Capitals and cultures",
 "Rotation and sunrise",
 "Earth's tilt and revolution around the Sun",
 "Oceans and languages"
 ],
 a:2,
 e:"Earth's tilt and revolution around the Sun are connected with seasonal changes."
},
{
 q:"Meera is visiting Japan and notices that people follow traditions, eat different foods and speak a different language from those she is familiar with. What does this best demonstrate?",
 o:[
 "All countries have the same culture",
 "Culture can include food, language, clothing and traditions",
 "Culture only means the food people eat",
 "Culture depends only on the climate"
 ],
 a:1,
 e:"Culture includes aspects such as food, language, clothing, traditions and beliefs."
},
{
 q:"A student has to plan a one-day visit to Canberra and wants to include places to visit, food to try and activities to do. Which information from the chapter would be most useful first?",
 o:[
 "Canberra is the capital of Australia",
 "Canberra is the capital of Japan",
 "Canberra has a tropical monsoon climate",
 "Canberra is located in India"
 ],
 a:0,
 e:"Canberra is the capital of Australia."
},
{
 q:"What would be the most likely immediate effect if the Earth stopped rotating on its axis?",
 o:[
 "The regular cycle of day and night would be disrupted",
 "The Earth would stop revolving around the Sun",
 "The continents would disappear",
 "All countries would lose their capitals"
 ],
 a:0,
 e:"Rotation is responsible for the regular cycle of day and night."
},
{
 q:"A learner wants to explain why sunrise and sunset occur at different times in different places. Which idea should be used?",
 o:[
 "The Earth rotates, so different places face the Sun at different times",
 "The Sun changes its size throughout the day",
 "All places receive sunlight at exactly the same time",
 "The Moon causes sunrise and sunset"
 ],
 a:0,
 e:"Earth's rotation causes different places to face the Sun at different times."
}
];

let questionsPlayed=[];
let idx=0, score=0, attempt=1, timer=45, timerID=null, answered=false;

const $=id=>document.getElementById(id);
const splash=$("splash"), intro=$("intro"), game=$("game"), result=$("result");
const qText=$("questionText"), options=$("options"), feedback=$("feedback");
const scoreChip=$("scoreChip"), timerChip=$("timerChip"), attemptChip=$("attemptChip");
const qChip=$("qChip"), bar=$("bar"), finalScore=$("finalScore"), finalText=$("finalText");

function show(section){
  [splash,intro,game,result].forEach(x=>x.classList.remove("active"));
  section.classList.add("active");
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function prepareQuestions(){
  questionsPlayed=questions.map(q=>({
    ...q,
    o:q.o.map((text,i)=>({text,correct:i===q.a}))
  }));
  shuffle(questionsPlayed);
}

function play(audio){
  try{audio.currentTime=0;audio.play();}catch(e){}
}

function effects(ok){
  const layer=$("effects");
  const symbols=ok?["⭐","✨","🌟","🎉"]:["✖"];
  for(let i=0;i<(ok?14:1);i++){
    const s=document.createElement("span");
    s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left=(Math.random()*92+4)+"vw";
    s.style.top=(Math.random()*75+10)+"vh";
    layer.appendChild(s);
    setTimeout(()=>s.remove(),850);
  }
}

function startTimer(){
  clearInterval(timerID);
  timer=45;
  timerChip.textContent="⏱ "+timer+"s";
  timerID=setInterval(()=>{
    timer--;
    timerChip.textContent="⏱ "+timer+"s";
    if(timer<=0){
      clearInterval(timerID);
      timeUp();
    }
  },1000);
}

function render(){
  answered=false;
  attempt=1;
  attemptChip.textContent="Attempt 1/2";
  qChip.textContent="Q "+(idx+1)+"/"+questionsPlayed.length;
  scoreChip.textContent="⭐ "+score;
  bar.style.width=(idx/questionsPlayed.length*100)+"%";
  feedback.className="feedback";
  feedback.textContent="Choose the best answer.";

  const q=questionsPlayed[idx];
  qText.textContent=q.q;
  options.innerHTML="";

  const choices=shuffle([...q.o]);
  choices.forEach((choice,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML="<strong>"+String.fromCharCode(65+i)+".</strong> "+choice.text;
    b.onclick=()=>answer(choice,b);
    options.appendChild(b);
  });
}

function disableAll(){
  options.querySelectorAll("button").forEach(b=>b.disabled=true);
}

function revealCorrect(){
  const q=questionsPlayed[idx];
  options.querySelectorAll("button").forEach(b=>{
    const label=b.textContent.slice(3);
    const found=q.o.find(c=>c.text===label);
    if(found && found.correct)b.classList.add("correct");
  });
}

function answer(choice,button){
  if(answered)return;
  const q=questionsPlayed[idx];

  if(choice.correct){
    answered=true;
    clearInterval(timerID);
    score++;
    scoreChip.textContent="⭐ "+score;
    button.classList.add("correct");
    disableAll();
    feedback.className="feedback good";
    feedback.textContent="🎉 Correct! "+q.e;
    play($("correctSound"));
    play($("clapSound"));
    effects(true);
    setTimeout(next,1300);
  }else{
    button.classList.add("wrong");
    play($("wrongSound"));
    effects(false);

    if(attempt===1){
      attempt=2;
      attemptChip.textContent="Attempt 2/2";
      feedback.className="feedback bad";
      feedback.textContent="💡 Not quite. Think carefully and try once more.";
      button.disabled=true;
    }else{
      clearInterval(timerID);
      answered=true;
      disableAll();
      revealCorrect();
      feedback.className="feedback bad";
      const correct=q.o.find(c=>c.correct).text;
      feedback.innerHTML="Correct answer: <b>"+correct+"</b><br>"+q.e;
      setTimeout(next,1700);
    }
  }
}

function timeUp(){
  if(answered)return;
  answered=true;
  clearInterval(timerID);
  disableAll();
  revealCorrect();
  const q=questionsPlayed[idx];
  const correct=q.o.find(c=>c.correct).text;
  feedback.className="feedback bad";
  feedback.innerHTML="⏰ Time's up! Correct answer: <b>"+correct+"</b><br>"+q.e;
  setTimeout(next,1700);
}

function next(){
  idx++;
  if(idx<questionsPlayed.length){
    render();
    startTimer();
  }else{
    endGame();
  }
}

function endGame(){
  clearInterval(timerID);
  show(result);
  finalScore.textContent=score+"/"+questionsPlayed.length;
  if(score>=10){
    finalText.textContent="🌟 Excellent thinking! You connected ideas and solved the HOTS questions carefully.";
  }else if(score>=7){
    finalText.textContent="👏 Great work! Keep connecting what you learn with real-world situations.";
  }else if(score>=5){
    finalText.textContent="👍 Well tried! Review the chapter and challenge yourself again.";
  }else{
    finalText.textContent="🌍 Keep exploring Our World! Read the chapter once more and try again.";
  }
}

$("startBtn").onclick=()=>{
  idx=0; score=0;
  prepareQuestions();
  show(game);
  render();
  startTimer();
};

$("restartBtn").onclick=()=>{
  idx=0;score=0;
  prepareQuestions();
  show(game);
  render();
  startTimer();
};

/* Keep the splash clean and show it for 5 seconds. */
show(splash);
setTimeout(()=>show(intro),5000);
</script>
</body>
</html>
